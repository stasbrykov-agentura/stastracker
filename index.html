<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стастрекер</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111214">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Стастрекер">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: тёмный «пульт» в духе ХК — главная из плиток (bento), списки крупными карточками, нижняя панель с кнопкой «+» на телефоне, боковое дерево на десктопе */
:root{
  --bg:#111214; --bar:#18191c; --surface:#1b1c20; --surface-2:#232328; --surface-3:#2e2c28; --line:#2f2d29;
  --fg:#e6dcc6; --fg-hi:#ece2cb; --muted:#8f8676; --soft:#b9af9b;
  --accent:#c4a066; --accent-ink:#1d150a; --accent-soft:#2a2419; --accent-line:#7a5f33;
  --danger:#e0784f; --warn:#d9a441; --ok:#9db27a; --ok-ink:#141a0e;
  --scrim:rgba(0,0,0,.62); --shadow:0 18px 44px rgba(0,0,0,.6);
  --f-display:"Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side-w:280px; --ed-w:410px; --r-tile:14px; --r-card:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100%}

/* ---------- sidebar (desktop) / drawer (phone) ---------- */
.side{background:var(--bar);border-right:1px solid var(--line);overflow-y:auto;min-width:0}
.side-inner{padding:20px 14px 20px 16px;display:flex;flex-direction:column;gap:22px;min-height:100%}
.brand{display:flex;align-items:center;gap:10px}
.brand-name{font-weight:700;font-size:19px;flex:1;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item,.tree-link{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:12px;color:var(--fg);min-width:0}
.nav-item:hover,.tree-link:hover{background:var(--surface)}
.nav-item.is-active,.tree-row.is-active .tree-link{background:var(--accent-soft);color:var(--accent)}
.nav-ic{color:var(--accent);display:flex}
.nav-label{flex:1;min-width:0}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.count.is-warn{color:var(--danger);font-weight:500}
.sec{display:flex;flex-direction:column;gap:6px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 10px}
.sec-title{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec-title-btn:hover{color:var(--fg)}
.sec-actions{display:flex;gap:2px}
.mini-btn{font-size:12.5px;color:var(--muted);padding:4px 8px;border-radius:8px;display:flex;align-items:center;gap:4px}
.mini-btn:hover{background:var(--surface);color:var(--fg)}
.tree{display:flex;flex-direction:column;gap:1px}
.tree-row{display:flex;align-items:center;padding-left:calc(var(--d,0) * 14px)}
.twisty{width:22px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:6px;flex:none}
.twisty:hover{color:var(--fg)}
.twisty-sp{width:22px;flex:none}
.tree-link{padding:6px 8px;gap:9px}
.tree-link svg{color:var(--accent)}
.tree-link .tl-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row.is-paused .tl-name{color:var(--muted)}
.tree-row.is-finished .tl-name{color:var(--muted);text-decoration:line-through}
.tree-empty{font-size:13px;color:var(--muted);padding:4px 10px}
.example-note{background:var(--surface);border-radius:16px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:10px}
.example-note p{color:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.store-warn{font-size:12.5px;color:var(--warn);padding:0 10px}

/* ---------- main ---------- */
.main{overflow-y:auto;min-width:0;background:var(--bg);position:relative}
.topbar{display:none}
.main-inner{max-width:780px;margin:0 auto;padding:30px 32px 120px;display:flex;flex-direction:column;gap:18px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--muted)}
.crumbs button:hover{color:var(--fg)}
.view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.vh-text{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.view-head h1{font-weight:700;font-size:30px;line-height:1.15;letter-spacing:-.015em;overflow-wrap:anywhere}
.vh-sub{color:var(--muted);font-size:15px;max-width:60ch}
.vh-actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:8px 16px;border-radius:999px;background:var(--surface);color:var(--accent);align-self:flex-start}
.pill.is-muted{color:var(--muted)}
.pill.is-ok{color:var(--ok)}
.pill-sm{font-size:12.5px;padding:4px 11px}

/* ---------- home bento ---------- */
.home-head{display:flex;flex-direction:column;gap:10px;padding:6px 4px 8px}
.home-title{font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-.025em}
.home-date{font-size:17px;color:var(--accent);font-weight:500}
.bento{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1fr);gap:14px}
.bento-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.tile{background:var(--surface);border-radius:var(--r-tile);padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-width:0;min-height:0;text-align:left;transition:transform .12s ease,background .12s ease}
.tile:hover{background:var(--surface-2)}
.tile:active{transform:scale(.985)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tile-ic{color:var(--accent)}
.tile-count{font-size:15px;color:var(--fg);text-align:right;line-height:1.35}
.tile-count .is-warn{color:var(--danger)}
.tile-label{font-weight:700;font-size:26px;letter-spacing:-.01em;line-height:1.1}
.tile-big{flex:1;min-height:180px}
.tile-small{flex:1;align-items:center;justify-content:center;gap:8px;padding:18px 12px;min-height:110px}
.tile-small .tile-label{font-size:16px;font-weight:600;color:var(--accent);text-align:center}
.tile-small .tile-badge{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tile-wide{flex-direction:row;align-items:center;justify-content:flex-start;gap:20px;padding:26px 26px;grid-column:1 / -1}
.tile-wide .tw-text{display:flex;flex-direction:column;gap:6px;min-width:0}
.tile-wide .tile-label{font-size:26px}
.tile-wide .tile-sub{font-size:16px;color:var(--fg);opacity:.85}

/* ---------- card lists (projects, categories) ---------- */
.rows{display:flex;flex-direction:column;gap:12px}
.row-card{background:var(--surface);border-radius:var(--r-card);padding:20px 22px;display:flex;align-items:flex-start;gap:18px;width:100%;text-align:left;min-width:0}
.row-card:hover{background:var(--surface-2)}
.row-card .rc-ic{color:var(--accent);margin-top:2px}
.rc-text{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.rc-title{font-weight:600;font-size:19px;overflow-wrap:anywhere}
.rc-title.is-cat{text-transform:uppercase;letter-spacing:.02em}
.rc-sub{font-size:15px;color:var(--muted)}
.rc-goal{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-card.is-paused .rc-title{color:var(--muted)}
.row-card.is-finished .rc-title{color:var(--muted);text-decoration:line-through}
.rc-star{color:var(--warn)}

.goal{background:var(--surface);border-radius:var(--r-card);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.goal-label{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.goal-text{font-size:18px;line-height:1.4;overflow-wrap:anywhere}
.goal-text.is-empty{color:var(--muted);font-size:15px}
.progress{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:999px;background:var(--surface-2);font-size:14.5px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{background:var(--accent);filter:brightness(1.08)}
.btn-danger{background:var(--danger);color:var(--accent-ink)}
.btn-danger:hover{background:var(--danger);filter:brightness(1.08)}
.btn-ghost-danger{color:var(--danger);background:transparent}
.btn-ghost-danger:hover{background:var(--surface-2)}
.btn-sm{padding:6px 12px;font-size:13.5px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--fg)}
.icon-btn:hover{background:var(--surface)}
.icon-btn.is-on{color:var(--warn)}

.qa{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:18px;padding:7px 7px 7px 16px}
.qa:focus-within{box-shadow:0 0 0 2px var(--accent)}
.qa-plus{color:var(--accent);display:flex}
.qa input{flex:1;min-width:0;border:0;background:transparent;padding:7px 0;outline:none;font-size:16px}
.qa-hint{font-size:12px;color:var(--muted);margin-top:-10px;padding-left:16px;font-family:var(--f-mono)}

.group{display:flex;flex-direction:column;gap:8px}
.group-head{display:flex;align-items:baseline;gap:8px;padding:2px 6px}
.group-head h2{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.group-head.is-warn h2{color:var(--danger)}
.group-head .count{margin-left:auto}
.group-day h2{text-transform:none;letter-spacing:0;font-size:17px;color:var(--fg)}
.group-day .day-date{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:13px;padding:14px 16px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task:hover{background:var(--surface-2)}
.task.is-open{background:var(--accent-soft)}
.check{flex:none;width:22px;height:22px;margin-top:0;border:2px solid var(--muted);border-radius:7px;display:grid;place-items:center;color:transparent;background:transparent}
.check:hover{border-color:var(--accent)}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.task-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding:0}
.task-title{overflow-wrap:anywhere;font-size:16px}
.task-title em{color:var(--muted)}
.task.is-done .task-title{color:var(--muted);text-decoration:line-through}
.task-meta{display:flex;flex-wrap:wrap;gap:4px 12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.chip svg{width:12px;height:12px}
.chip-date{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.chip-date.is-overdue{color:var(--danger);font-weight:500}
.chip-date.is-today{color:var(--accent);font-weight:500}
.chip-ctx{color:var(--accent)}
.chip-star{color:var(--warn)}
.empty{background:var(--surface);border-radius:var(--r-card);padding:22px 20px;color:var(--muted);font-size:15px}
.empty-soft{color:var(--muted);font-size:14px;padding:2px 6px 6px}
.link-btn{color:var(--accent);font-size:14px;font-weight:600;align-self:flex-start;padding:2px 6px}
.link-btn:hover{text-decoration:underline}

.search-box{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:18px;padding:12px 16px;color:var(--muted)}
.search-box:focus-within{box-shadow:0 0 0 2px var(--accent)}
.search-box input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:17px;color:var(--fg)}

.trash-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.trash-row:first-child{border-top:0}
.trash-row .tr-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.trash-row .tr-title{overflow-wrap:anywhere}
.trash-row .tr-sub{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}

/* ---------- editor ---------- */
.editor{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;min-width:0}
.ed-inner{padding:16px 20px 30px;display:flex;flex-direction:column;gap:20px}
.ed-head{display:flex;align-items:center;gap:4px}
.ed-kicker{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);flex:1}
.ed-title-row{display:flex;gap:12px;align-items:flex-start}
.ed-title-row .check{margin-top:6px}
#ed-title{flex:1;min-width:0;border:0;background:transparent;resize:none;font-family:var(--f-body);font-size:21px;font-weight:600;line-height:1.3;padding:2px 0;outline:none;overflow:hidden}
#ed-title:focus{box-shadow:0 2px 0 var(--accent)}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field-label{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input:not([type="checkbox"]),.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;line-height:1.45}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-dates{display:flex;flex-wrap:wrap;gap:6px}
.qd{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--fg)}
.qd:hover{background:var(--surface-3)}
.ctx-picks{display:flex;flex-wrap:wrap;gap:6px}
.ctx-pick{font-size:13.5px;padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.ctx-pick:hover{color:var(--fg)}
.ctx-pick[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ctx-pick.is-add{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.ed-foot{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.ed-stamp{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.grab,.ed-back{display:none}
.tok-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tok-bar::-webkit-scrollbar{display:none}
.tok{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface-2);font-size:14.5px;font-weight:600;color:var(--accent);white-space:nowrap}
.tok:hover{background:var(--surface-3)}
.tok-sym{font-family:var(--f-mono);min-width:48px;text-align:center;font-size:17px}
.tok-ctx{color:var(--fg);font-weight:500}
.picker-btn{display:flex;align-items:center;gap:10px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;color:var(--fg)}
.picker-btn svg:first-child{color:var(--accent)}
.picker-btn svg:last-child{color:var(--muted)}
.picker-btn[aria-expanded="true"]{border-color:var(--accent)}
.picker-btn .pb-val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker-btn.is-empty .pb-val{color:var(--muted)}
.pop{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pop-label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pop-foot{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-title{font-weight:600;font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-wd{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;padding:4px 0}
.cal-day{height:40px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.cal-day:hover{background:var(--surface-2)}
.cal-day.is-past{color:var(--muted)}
.cal-day.is-today{color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-day.is-sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tp-grid{display:grid;gap:5px}
.tp-hours{grid-template-columns:repeat(6,minmax(0,1fr))}
.tp-mins{grid-template-columns:repeat(4,minmax(0,1fr))}
.tp-dur{grid-template-columns:repeat(3,minmax(0,1fr))}
.tp-btn{padding:9px 0;border-radius:10px;background:var(--surface-2);font-family:var(--f-mono);font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.tp-dur .tp-btn{font-family:var(--f-body);font-size:13.5px;padding:9px 4px}
.tp-btn:hover{background:var(--surface-3)}
.tp-btn.is-sel{background:var(--accent);color:var(--accent-ink);font-weight:600}
.del-confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px}

/* ---------- FAB, bottom bar, action arc ---------- */
.bottombar{display:none}
.fab{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .15s ease}
.fab:hover{filter:brightness(1.06)}
.fab:active{transform:scale(.95)}
.fab.is-open svg{transform:rotate(45deg)}
.fab svg{transition:transform .18s ease}
.fab-desk{position:fixed;right:max(28px,env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:42}
.arc-wrap{position:fixed;inset:0;z-index:41}
.arc-back{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.arc{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);height:auto;min-height:230px;padding:36px 20px calc(110px + env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:50% 50% 0 0 / 120px 120px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;gap:20px;animation:arcIn .2s ease}
.arc.has-primary{padding-top:30px;border-radius:50% 50% 0 0 / 150px 150px 0 0}
.arc-row{display:flex;justify-content:center;align-items:flex-start;gap:clamp(14px,6vw,40px);flex-wrap:wrap}
.arc-item.is-primary{width:auto}
.arc-item.is-primary .arc-ic{width:86px;height:86px;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.arc-item.is-primary .arc-label{font-size:16.5px}
.arc.has-primary .arc-row{gap:clamp(18px,8vw,48px)}
.arc.has-primary .arc-row .arc-ic{width:52px;height:52px}

<script>
(function(){
'use strict';

/* ================= storage & records ================= */
const KEY='stastracker.db.v1', UIKEY='stastracker.ui.v1';
const KINDS=['folders','projects','tasks','contexts'];
let db, ui, storageOk=true;
function emptyDB(){return {schema:1,ownerId:'me',folders:{},projects:{},tasks:{},contexts:{},seeded:false}}
function load(){
  db=emptyDB();
  try{const s=localStorage.getItem(KEY); if(s){const p=JSON.parse(s); if(p&&p.tasks) db=Object.assign(emptyDB(),p);}}catch(e){storageOk=false}
  ui={collapsed:{},showDone:false};
  try{const s=localStorage.getItem(UIKEY); if(s) ui=Object.assign(ui,JSON.parse(s));}catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOk=true}catch(e){storageOk=false}}
function saveUI(){try{localStorage.setItem(UIKEY,JSON.stringify(ui))}catch(e){}}
function uid(){
  if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)});
}
/* every record: id, ownerId, createdAt, updatedAt, deleted, fieldTs{field:time} — for last-write-wins sync later */
function create(kind,fields){
  const now=Date.now();
  const r=Object.assign({id:uid(),ownerId:db.ownerId,createdAt:now,updatedAt:now,deleted:false,fav:false,fieldTs:{}},fields);
  Object.keys(r).forEach(k=>{if(k!=='fieldTs'&&k!=='id') r.fieldTs[k]=now});
  db[kind][r.id]=r; save(); markDirty(kind,r.id); return r;
}
function patch(kind,id,fields){
  const r=db[kind][id]; if(!r) return null;
  if(!r.fieldTs) r.fieldTs={};
  const now=Date.now(); let changed=false;
  for(const k in fields){ if(JSON.stringify(r[k])!==JSON.stringify(fields[k])){ r[k]=fields[k]; r.fieldTs[k]=now; changed=true; } }
  if(changed){ r.updatedAt=now; save(); markDirty(kind,id); }
  return r;
}
function softDelete(kind,id,extra){patch(kind,id,Object.assign({deleted:true},extra||{}))}
function purge(kind,id){patch(kind,id,{deleted:true,purged:true})}
function all(kind){return Object.values(db[kind]).filter(r=>!r.deleted)}
function get(kind,id){const r=id&&db[kind][id]; return r&&!r.deleted?r:null}

const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>isoDate(new Date());
const parseISO=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(iso,n)=>{const d=parseISO(iso);d.setDate(d.getDate()+n);return isoDate(d)};
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const WDF=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function fmtDate(iso){
  if(!iso) return '';
  const t=todayISO();
  if(iso===t) return 'сегодня'; if(iso===addDays(t,1)) return 'завтра'; if(iso===addDays(t,-1)) return 'вчера';
  const d=parseISO(iso);
  return `${d.getDate()} ${MON[d.getMonth()]}, ${WD[d.getDay()]}`+(d.getFullYear()!==new Date().getFullYear()?` ${d.getFullYear()}`:'');
}
function fmtLong(iso){const d=parseISO(iso);return `${WDF[d.getDay()]}, ${d.getDate()} ${MONG[d.getMonth()]}`}
function fmtStamp(ms){const d=new Date(ms);return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmtDur(m){m=Number(m);if(!m) return '';if(m<60) return `${m} мин`;const h=Math.floor(m/60),r=m%60;return r?`${h} ч ${r} мин`:`${h} ч`}
function plural(n,f){const a=Math.abs(n)%100,b=a%10;return `${n} ${a>10&&a<20?f[2]:b>1&&b<5?f[1]:b===1?f[0]:f[2]}`}
const PL={task:['задача','задачи','задач'],proj:['проект','проекта','проектов'],cat:['категория','категории','категорий'],ctx:['контекст','контекста','контекстов']};
const byName=(a,b)=>a.name.localeCompare(b.name,'ru');
function children(kind,parentId){return all(kind).filter(r=>(r.parentId||null)===(parentId||null)).sort(byName)}
function descendants(kind,id){const out=[id];for(const c of children(kind,id)) out.push(...descendants(kind,c.id));return out}
function folderPath(fid){const parts=[];let f=get('folders',fid),g=0;while(f&&g++<50){parts.unshift(f);f=get('folders',f.parentId)}return parts}
function projectLabel(p){return [...folderPath(p.folderId).map(f=>f.name),p.name].join(' / ')}
const STATUS={active:'Активен',paused:'На паузе',finished:'Завершён'};
const STATUS_ORDER={active:0,paused:1,finished:2};
function projectsIn(fid){return all('projects').filter(p=>(p.folderId||null)===(fid||null)).sort((a,b)=>(STATUS_ORDER[a.status]||0)-(STATUS_ORDER[b.status]||0)||byName(a,b))}
function sortTasks(list){
  return list.sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    if(a.done) return (b.doneAt||0)-(a.doneAt||0);
    const da=a.date||'9999-99-99', dbb=b.date||'9999-99-99';
    if(da!==dbb) return da<dbb?-1:1;
    const ta=a.time||'99', tb=b.time||'99';
    if(ta!==tb) return ta<tb?-1:1;
    return a.createdAt-b.createdAt;
  });
}
function flatTree(kind,pid,d,out){out=out||[];d=d||0;for(const r of children(kind,pid||null)){out.push({r,d});flatTree(kind,r.id,d+1,out)}return out}
function catStats(fid){
  const ids=descendants('folders',fid);
  return {cats:ids.length-1, projs:ids.reduce((a,id)=>a+projectsIn(id).length,0)};
}
function catSub(fid){const s=catStats(fid);return [s.cats?plural(s.cats,PL.cat):'',plural(s.projs,PL.proj)].filter(Boolean).join(', ')}
function projSub(p){const n=all('tasks').filter(t=>t.projectId===p.id&&!t.done).length;return n?plural(n,PL.task):'Нет задач'}

function parseHash(){
  const h=(location.hash||'').slice(1);
  const m=h.match(/^(project|folder|context)-([0-9a-f-]{8,})$/i);
  if(m) return {view:m[1],id:m[2]};
  if(VIEWNAMES[h]) return {view:h};
  return {view:'home'};
}
function go(r){
  route=r; delConfirm=false; closeFab(true); if(isPhone()){editingId=null;edPicker=null}
  const h=r.id?`${r.view}-${r.id}`:r.view;
  if((location.hash||'').slice(1)!==h){try{history.replaceState(null,'','#'+h)}catch(e){try{location.hash=h}catch(e2){}}}
  closeDrawer(); render();
  const m=$('#main'); if(m) m.scrollTop=0;
}
function parentRoute(){
  const v=route.view;
  if(v==='project'){const p=get('projects',route.id);return p&&get('folders',p.folderId)?{view:'folder',id:p.folderId}:{view:'projects'}}
  if(v==='folder'){const f=get('folders',route.id);return f&&get('folders',f.parentId)?{view:'folder',id:f.parentId}:{view:'projects'}}
  if(v==='context'){const c=get('contexts',route.id);return c&&get('contexts',c.parentId)?{view:'context',id:c.parentId}:{view:'contexts'}}
  return {view:'home'};
}

function counts(){
  const t=todayISO(), open=all('tasks').filter(x=>!x.done);
  return {
    inbox:open.filter(x=>!x.projectId).length,
    today:open.filter(x=>x.date&&x.date<=t).length,
    overdue:open.filter(x=>x.date&&x.date<t).length,
    week:open.filter(x=>x.date&&x.date>=t&&x.date<=addDays(t,6)).length,
    fav:['projects','contexts','tasks','folders'].reduce((a,k)=>a+all(k).filter(r=>r.fav&&!(k==='tasks'&&r.done)).length,0),
    trash:KINDS.reduce((a,k)=>a+Object.values(db[k]).filter(r=>r.deleted&&!r.purged&&!r.deletedWith).length,0)

function folderTree(pid,d){

    h+=`<div class="tree-row${act}" style="--d:${d}"><button class="twisty" data-act="toggle-fold" data-id="${f.id}" aria-expanded="${!col}" aria-label="${col?'Развернуть':'Свернуть'} категорию">${col?ICON.chevR:ICON.chevD}</button><button class="tree-link" data-act="go" data-view="folder" data-id="${f.id}" title="${esc(f.name)}">${ICON.folder}<span class="tl-name">${esc(f.name)}</span></button></div>`;

  }

    const cls=!t.done&&t.date<today?' is-overdue':(t.date===today?' is-today':'');
    chips.push(`<span class="chip chip-date${cls}">${esc(fmtDate(t.date))}${t.time?' · '+esc(t.time):''}</span>`);

  for(const cid of (t.contexts||[])){const c=get('contexts',cid); if(c) chips.push(`<span class="chip chip-ctx">@${esc(c.name)}</span>`)}
  if(t.note&&t.note.trim()) chips.push(`<span class="chip" title="Есть заметка">${ICON.note}</span>`);
  return `<li class="task${t.done?' is-done':''}${editingId===t.id?' is-open':''}"><button class="check" data-act="toggle-done" data-id="${t.id}" aria-pressed="${!!t.done}" aria-label="${t.done?'Вернуть в работу':'Отметить выполненной'}">${ICON.check}</button><button class="task-body" data-act="edit" data-id="${t.id}"><span class="task-title">${t.title?esc(t.title):'<em>Без названия</em>'}</span>${chips.length?`<span class="task-meta">${chips.join('')}</span>`:''}</button></li>`;
}
function list(tasks,opts){return `<ul class="tasks">${sortTasks(tasks).map(t=>taskRow(t,opts)).join('')}</ul>`}
function taskBlock(tasks,opts,emptyMsg){
  const open=tasks.filter(t=>!t.done), done=tasks.filter(t=>t.done);
  let h=open.length?list(open,opts):`<div class="empty">${emptyMsg}</div>`;
  if(done.length){
    h+=`<button class="link-btn" data-act="toggle-showdone">${ui.showDone?'Скрыть выполненные':`Показать выполненные (${done.length})`}</button>`;
    if(ui.showDone) h+=list(done,opts);
  }
  return h;
}
function group(title,tasks,opts,cls){
  if(!tasks.length) return '';
  return `<section class="group"><div class="group-head${cls?' '+cls:''}"><h2>${title}</h2><span class="count">${tasks.length}</span></div>${list(tasks,opts)}</section>`;
}
function crumbs(folders){
  if(!folders.length) return '';
  return `<nav class="crumbs" aria-label="Путь">${folders.map(f=>`<button data-act="go" data-view="folder" data-id="${f.id}">${esc(f.name)}</button><span>/</span>`).join('')}</nav>`;
}
function progress(done,total){
  const pct=total?Math.round(done/total*100):0;
  return `<div class="scale"><div class="scale-nums" aria-hidden="true"><span>0</span><span>·</span><span>25</span><span>·</span><span>50</span><span>·</span><span>75</span><span>·</span><span>100</span></div><div class="scale-track" aria-hidden="true"><span class="ln"></span><span class="scale-ticks">${'<i></i>'.repeat(17)}</span><span class="scale-fill" style="width:${pct}%"></span><span class="scale-needle" style="left:${pct}%"></span></div><span class="scale-cap">Выполнено ${done} / ${total} · ${pct}%</span></div>`;
}
function catCard(f){

function ctxCard(c){

}
function summaryPill(cats,projs){
  return `<span class="pill">${[cats?plural(cats,PL.cat):'',projs||!cats?plural(projs,PL.proj):''].filter(Boolean).join(', ')}</span>`;

function searchResults(){
  const q=query.trim().toLowerCase();
  if(!q) return '<p class="empty-soft">Начните вводить слово.</p>';
  const has=s=>(s||'').toLowerCase().includes(q);
  const projs=all('projects').filter(p=>has(p.name)||has(p.goal));
  const cats=all('folders').filter(f=>has(f.name));
  const tasks=all('tasks').filter(t=>has(t.title)||has(t.note));
  let h='';
  if(cats.length||projs.length) h+=`<section class="group"><div class="group-head"><h2>Проекты и категории</h2><span class="count">${cats.length+projs.length}</span></div><div class="rows">${cats.map(catCard).join('')}${projs.map(p=>projCard(p,true)).join('')}</div></section>`;
  if(tasks.length) h+=`<section class="group"><div class="group-head"><h2>Задачи</h2><span class="count">${tasks.length}</span></div>${list(tasks,{})}</section>`;
  return h||'<p class="empty-soft">Ничего не нашлось.</p>';
}

/* ===== recurrence ===== */
const WDS=['пн','вт','ср','чт','пт','сб','вс'];
const WD_NOM=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const WD_ACC=['понедельник','вторник','среду','четверг','пятницу','субботу','воскресенье'];
const WD_G=['m','m','f','m','f','f','n'];
const ORD={m:['первый','второй','третий','четвёртый'],f:['первую','вторую','третью','четвёртую'],n:['первое','второе','третье','четвёртое']};
const LAST={m:'последний',f:'последнюю',n:'последнее'};
const EACH={m:'Каждый',f:'Каждую',n:'Каждое'};
const monIdx=d=>(d.getDay()+6)%7;
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
function nthWeekday(y,m,nth,wd){
  if(nth===-1){const last=daysIn(y,m), d=new Date(y,m,last); return new Date(y,m,last-((monIdx(d)-wd+7)%7))}
  const off=(wd-monIdx(new Date(y,m,1))+7)%7; return new Date(y,m,1+off+(nth-1)*7);
}
function monthDay(r,y,m){return r.mode==='nth'?nthWeekday(y,m,r.nth,r.wd):new Date(y,m,Math.min(r.day,daysIn(y,m)))}
function makeRule(freq,base){
  const d=parseISO(base), mi=monIdx(d), dom=d.getDate(), c=Math.ceil(dom/7), nth=c<=4?c:-1;
  if(freq==='day') return {freq:'day',every:1};
  if(freq==='week') return {freq:'week',every:1,wds:[mi]};
  if(freq==='month') return {freq:'month',every:1,mode:'date',day:dom,nth,wd:mi};
  return {freq:'year',every:1,day:dom,month:d.getMonth()};
}
function ruleMatches(r,iso){
  const d=parseISO(iso), y=d.getFullYear(), m=d.getMonth();
  if(r.freq==='day') return true;
  if(r.freq==='week') return (r.wds||[]).includes(monIdx(d));
  if(r.freq==='month') return isoDate(monthDay(r,y,m))===iso;
  if(r.freq==='year') return m===r.month&&d.getDate()===Math.min(r.day,daysIn(y,m));
  return false;
}
function weekStartMs(iso){const d=parseISO(iso); d.setDate(d.getDate()-monIdx(d)); return d.getTime()}
function nextOcc(r,iso){
  const n=Math.max(1,Math.round(Number(r.every))||1), d=parseISO(iso);
  if(r.freq==='day') return addDays(iso,n);
  if(r.freq==='week'){
    const wds=(r.wds&&r.wds.length)?r.wds:[monIdx(d)], a=weekStartMs(r.anchor||iso);
    for(let i=1;i<=7*n+7;i++){
      const c=addDays(iso,i), wk=Math.round((weekStartMs(c)-a)/(7*864e5));
      if(wds.includes(monIdx(parseISO(c)))&&((wk%n)+n)%n===0) return c;
    }
    return addDays(iso,7*n);
  }
  if(r.freq==='month'){const t=new Date(d.getFullYear(),d.getMonth()+n,1); return isoDate(monthDay(r,t.getFullYear(),t.getMonth()))}
  if(r.freq==='year'){const y=d.getFullYear()+n; return isoDate(new Date(y,r.month,Math.min(r.day,daysIn(y,r.month))))}
  return addDays(iso,1);
}
function firstOnOrAfter(r,iso){
  if(ruleMatches(r,iso)) return iso;
  const d=parseISO(iso), y=d.getFullYear(), m=d.getMonth();
  if(r.freq==='month'){const c=isoDate(monthDay(r,y,m)); if(c>=iso) return c; const t=new Date(y,m+1,1); return isoDate(monthDay(r,t.getFullYear(),t.getMonth()))}
  if(r.freq==='year'){const c=isoDate(new Date(y,r.month,Math.min(r.day,daysIn(y,r.month)))); if(c>=iso) return c; return isoDate(new Date(y+1,r.month,Math.min(r.day,daysIn(y+1,r.month))))}
  if(r.freq==='week'){for(let i=1;i<=7;i++){const c=addDays(iso,i); if(ruleMatches(r,c)) return c}}
  return iso;
}
function nextAfter(r,from,today){let n=nextOcc(r,from),g=0; while(n<today&&g++<2000) n=nextOcc(r,n); return n}
function repText(r){
  if(!r) return 'Без повтора';
  const n=Math.max(1,Math.round(Number(r.every))||1);
  if(r.freq==='day') return n===1?'Каждый день':`Каждые ${plural(n,['день','дня','дней'])}`;
  if(r.freq==='week'){
    const w=(r.wds||[]).slice().sort((a,b)=>a-b), work=w.length===5&&w.join()==='0,1,2,3,4';
    if(n===1&&work) return 'По будням';
    if(n===1&&w.length===7) return 'Каждый день';
    return `${n===1?'Каждую неделю':`Каждые ${plural(n,['неделю','недели','недель'])}`}: ${w.map(i=>WDS[i]).join(', ')}`;
  }
  if(r.freq==='month'){
    const head=n===1?'Каждый месяц':`Каждые ${plural(n,['месяц','месяца','месяцев'])}`;
    if(r.mode==='nth'){const g=WD_G[r.wd], o=r.nth===-1?LAST[g]:ORD[g][r.nth-1]; return n===1?`${EACH[g]} ${o} ${WD_ACC[r.wd]} месяца`:`${head}: ${o} ${WD_ACC[r.wd]}`}
    return `${head}, ${r.day}-го`;
  }
  if(r.freq==='year') return `${n===1?'Каждый год':`Каждые ${plural(n,['год','года','лет'])}`}, ${r.day} ${MONG[r.month]}`;
  return 'Повтор';
}
/* ===== end recurrence ===== */

const MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function fmtDateFull(iso){

  const base=`${WD[d.getDay()]}, ${d.getDate()} ${MONG[d.getMonth()]}`+(d.getFullYear()!==new Date().getFullYear()?` ${d.getFullYear()}`:'');
  return rel?`${rel} · ${base}`:base[0].toUpperCase()+base.slice(1);
}

function repHTML(t){
  const base=t.date||todayISO(), d=parseISO(base), mi=monIdx(d), dom=d.getDate(), c=Math.ceil(dom/7), nth=c<=4?c:-1;
  const r=t.repeat, cur=r||makeRule('week',base);
  const pre=[['none','Без повтора'],['day','Каждый день'],['workdays','По будням'],['week',`Каждую неделю · ${WDS[mi]}`],['month',`Каждый месяц · ${dom}-го`],['monthnth',`Каждый месяц · ${nth===-1?'последн.':nth+'-й'} ${WDS[mi]}`],['year',`Каждый год · ${dom} ${MONG[d.getMonth()]}`]];
  let h=`<div class="pop" role="group" aria-label="Повтор"><div class="tp-grid tp-rep">${pre.map(([v,l])=>`<button class="tp-btn" data-act="rep-preset" data-v="${v}">${esc(l)}</button>`).join('')}</div>`;

  if(cur.freq==='week') h+=`<div class="tp-grid tp-wd">${WDS.map((w,i)=>{const on=(cur.wds||[]).includes(i);return `<button class="tp-btn${on?' is-sel':''}" data-act="rep-wd" data-v="${i}" aria-pressed="${on}">${w}</button>`}).join('')}</div>`;
  if(cur.freq==='month'){

    if(md==='nth') h+=`<div class="rep-row"><select id="rep-nth" aria-label="Какой по счёту">${[[1,'1-й'],[2,'2-й'],[3,'3-й'],[4,'4-й'],[-1,'последний']].map(([v,l])=>`<option value="${v}"${nn===v?' selected':''}>${l}</option>`).join('')}</select><select id="rep-wdsel" aria-label="День недели">${WD_NOM.map((w,i)=>`<option value="${i}"${ww===i?' selected':''}>${w}</option>`).join('')}</select><span>месяца</span></div>`;

}
function applyRule(t,rule){

function parseQuick(text){
  let date=null; const ids=[], created=[];
  text=text.replace(/(^|\s)!(сегодня|завтра)(?=\s|$)/gi,(m,s,w)=>{date=w.toLowerCase()==='сегодня'?todayISO():addDays(todayISO(),1);return s});
  text=text.replace(/(^|\s)@([^\s@!]+)/g,(m,s,name)=>{
    const n=name.toLowerCase();
    let c=all('contexts').find(c=>c.name.toLowerCase().replace(/\s+/g,'')===n);
    if(!c){c=create('contexts',{name,parentId:null});created.push(name)}
    if(!ids.includes(c.id)) ids.push(c.id);
    return s;
  });
  return {title:text.replace(/\s+/g,' ').trim(),date,ids,created};
}
function addQuickTask(raw,ctx){

  const contexts=[...new Set([...(ctx.contexts||[]),...q.ids])];
  create('tasks',{title:q.title,note:'',projectId:ctx.projectId||null,contexts,date:q.date||ctx.date||null,time:null,duration:0,done:false,doneAt:null});
  renderSide(); renderMain(); renderBottom();
  if(q.created.length) toast(`Создан контекст @${q.created.join(', @')}`);
  return true;
}

function toggleDone(id){

    const today=todayISO(), prev=t.date, from=t.date||today;
    const copy=create('tasks',{title:t.title,note:t.note||'',projectId:t.projectId||null,contexts:(t.contexts||[]).slice(),date:from,time:t.time||null,duration:t.duration||0,done:true,doneAt:Date.now(),repeatOf:t.id});
    const nx=nextAfter(t.repeat,from,today);
    patch('tasks',id,{date:nx});
    render();
    toast(`Выполнено. Следующий раз: ${fmtDate(nx)}`,'Вернуть',()=>{purge('tasks',copy.id); patch('tasks',id,{date:prev}); render()});

  patch('tasks',id,{done:v,doneAt:v?Date.now():null});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  switch(a){
    case 'go': go(id?{view:b.dataset.view,id}:{view:b.dataset.view}); break;
    case 'back': go(parentRoute()); break;
    case 'toggle-fold': ui.collapsed[id]=!ui.collapsed[id]; saveUI(); renderSide(); break;
    case 'toggle-done': toggleDone(id); break;
    case 'toggle-showdone': ui.showDone=!ui.showDone; saveUI(); renderMain(); break;
    case 'edit': openEditor(id); break;
    case 'ed-close': closeEditor(); break;
    case 'fav': { const k=b.dataset.kind, r=get(k,id); if(!r) break; patch(k,id,{fav:!r.fav}); render(); toast(r.fav?'Добавлено в избранное':'Убрано из избранного'); break; }
    case 'ed-date': {
      const v=b.dataset.v; const d=v==='clear'?null:addDays(todayISO(),Number(v));
      { const tk=get('tasks',editingId); if(tk) moveDate(tk,d); } edPicker=null; calMonth=null; renderSide(); renderMain(); renderEditor(true); break;
    }
    case 'pick': { const p=b.dataset.p; edPicker=edPicker===p?null:p; calMonth=null; renderEditor(true); break; }
    case 'cal-nav': {
      const t=get('tasks',editingId); const v=Number(b.dataset.v);
      if(v===0){calMonth=todayISO().slice(0,7)} else {const [y,m]=(calMonth||((t&&t.date)||todayISO()).slice(0,7)).split('-').map(Number); const d=new Date(y,m-1+v,1); calMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`}
      renderEditor(true); break;
    }
    case 'cal-day': { const tk=get('tasks',editingId); if(tk) moveDate(tk,b.dataset.v); } edPicker=null; calMonth=null; renderSide(); renderMain(); renderEditor(true); break;
    case 'time-h': { const t=get('tasks',editingId); if(!t) break; const mm=(t.time||'').split(':')[1]||'00'; patch('tasks',t.id,{time:`${b.dataset.v}:${mm}`}); renderMain(); renderEditor(true); break; }
    case 'time-m': { const t=get('tasks',editingId); if(!t) break; const hh=(t.time||'').split(':')[0]||'09'; patch('tasks',t.id,{time:`${hh}:${b.dataset.v}`}); edPicker=null; renderMain(); renderEditor(true); break; }
    case 'time-clear': patch('tasks',editingId,{time:null}); edPicker=null; renderMain(); renderEditor(true); break;
    case 'rep-preset': {
      const t=get('tasks',editingId); if(!t) break; const v=b.dataset.v, base=t.date||todayISO();
      let r=null;
      if(v==='day') r=makeRule('day',base);
      else if(v==='workdays') r={freq:'week',every:1,wds:[0,1,2,3,4]};
      else if(v==='week') r=makeRule('week',base);
      else if(v==='month') r=makeRule('month',base);
      else if(v==='monthnth'){r=makeRule('month',base); r.mode='nth'}
      else if(v==='year') r=makeRule('year',base);
      applyRule(t,r); edPicker=null; afterRule();
      if(r) toast(`Повтор: ${repText(r).toLowerCase()}`); break;
    }
    case 'rep-wd': {
      const t=get('tasks',editingId); if(!t) break; const r=curRule(t); if(r.freq!=='week'){r.freq='week'}
      const i=Number(b.dataset.v), w=new Set(r.wds||[]); if(w.has(i)){if(w.size>1) w.delete(i)} else w.add(i);
      r.wds=[...w].sort((a,c)=>a-c); applyRule(t,r); afterRule(); break;
    }
    case 'rep-mode': {
      const t=get('tasks',editingId); if(!t) break; const r=curRule(t);
      if(r.freq!=='month') Object.assign(r,makeRule('month',t.date||todayISO()),{every:r.every||1});
      r.mode=b.dataset.v; applyRule(t,r); afterRule(); break;
    }

/* ================= swipe down to close (phone) ================= */
const isPhone=()=>window.matchMedia('(max-width:859px)').matches;
function swipeToClose(container,getSheet,onClose){
  let y0=null,dy=0,active=false,sheet=null;
  container.addEventListener('touchstart',e=>{
    y0=null; if(!isPhone()) return;
    sheet=getSheet(); if(!sheet||!sheet.contains(e.target)) return;
    if(sheet.scrollTop>0) return;
    const ta=e.target.closest('textarea'); if(ta&&ta.scrollTop>0) return;
    y0=e.touches[0].clientY; dy=0; active=false;
  },{passive:true});
  container.addEventListener('touchmove',e=>{
    if(y0==null) return;
    dy=e.touches[0].clientY-y0;
    if(!active&&dy<0){y0=null;return}
    if(dy>8){active=true; sheet.style.transition='none'; sheet.style.transform=`translateY(${dy}px)`; if(e.cancelable) e.preventDefault();}
  },{passive:false});
  const end=()=>{
    if(y0==null) return; y0=null;
    if(!active) return;
    sheet.style.transition='transform .2s ease';
    if(dy>100){
      sheet.style.transform='translateY(110%)';
      const s=sheet; setTimeout(()=>{s.style.transform='';s.style.transition='';onClose()},190);
    } else {
      sheet.style.transform='';
      const s=sheet; setTimeout(()=>{s.style.transition=''},220);
    }
  };
  container.addEventListener('touchend',end);
  container.addEventListener('touchcancel',end);
}
swipeToClose($('#editor'),()=>$('#editor'),()=>{if(document.activeElement) document.activeElement.blur(); closeEditor()});
swipeToClose($('#modal'),()=>$('#modal .modal-card'),closeModal);

const SB_URL='https://uzyutfdsgcmpgvrskoya.supabase.co';

const SYNCKEY='stastracker.sync.v1';
let sb=null, session=null, sync={dirty:{},cursor:null,userId:null}, syncing=false, syncAgain=false, syncTimer=null, channel=null;
let syncState={status:'idle',at:null,error:null};
function loadSync(){try{const s=localStorage.getItem(SYNCKEY); if(s) sync=Object.assign(sync,JSON.parse(s))}catch(e){} if(!sync.dirty) sync.dirty={}}
function saveSync(){try{localStorage.setItem(SYNCKEY,JSON.stringify(sync))}catch(e){}}
function markDirty(kind,id){sync.dirty[kind+':'+id]=Date.now(); saveSync(); scheduleSync(1500)}
function scheduleSync(ms){clearTimeout(syncTimer); syncTimer=setTimeout(runSync,ms==null?0:ms)}
function dirtyCount(){return Object.keys(sync.dirty).length}
function syncLineHTML(){
  const n=dirtyCount();
  const st=syncState.status;
  if(!session) return '<span class="sync-dot"></span>Без входа: данные только на этом устройстве';
  if(st==='syncing') return '<span class="sync-dot"></span>Синхронизация…';
  if(st==='offline') return `<span class="sync-dot"></span>Нет сети. Изменения сохранены на устройстве${n?` (${n})`:''} и отправятся позже`;
  if(st==='error') return `<span class="sync-dot"></span>Не удалось синхронизировать${syncState.error?': '+esc(syncState.error):''}. Повторю сам`;
  if(syncState.at){const d=new Date(syncState.at); return `<span class="sync-dot"></span>Синхронизировано в ${pad(d.getHours())}:${pad(d.getMinutes())}${n?` · ждут отправки: ${n}`:''}`}
  return '<span class="sync-dot"></span>Подключаюсь к облаку…';
}
function setSyncState(status,error){
  syncState={status,at:status==='ok'?Date.now():syncState.at,error:error||null};
  const el=$('#sync-line');
  if(el){el.innerHTML=syncLineHTML(); el.className='sync-line'+(status==='error'?' is-err':status==='offline'?' is-off':status==='syncing'?' is-busy':'')}
}
function toRow(kind,r){const data=Object.assign({},r); delete data.fieldTs; return {id:r.id,kind,data,field_ts:r.fieldTs||{},updated_at:r.updatedAt||0}}
function mergeRow(row){
  const k=row.kind; if(!db[k]) return false;
  const data=row.data||{}, ts=row.field_ts||{};
  const loc=db[k][row.id];
  if(!loc){db[k][row.id]=Object.assign({},data,{fieldTs:Object.assign({},ts)}); return true}
  if(!loc.fieldTs) loc.fieldTs={};
  let ch=false;
  for(const f in data){
    const st=ts[f]||0, lt=loc.fieldTs[f]||0;
    if(st>lt||!(f in loc)){
      if(JSON.stringify(loc[f])!==JSON.stringify(data[f])){loc[f]=data[f]; ch=true}
      if(st>lt) loc.fieldTs[f]=st;
    }
  }
  if((row.updated_at||0)>(loc.updatedAt||0)) loc.updatedAt=row.updated_at;
  return ch;
}
function safeRender(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#main')&&a.matches('input,textarea')){renderSide();renderBottom();renderEditor();return}

async function runSync(){
  if(!sb||!session) return;
  if(!navigator.onLine){setSyncState('offline');return}
  if(syncing){syncAgain=true;return}
  syncing=true; setSyncState('syncing');
  try{
    const keys=Object.keys(sync.dirty);
    for(let i=0;i<keys.length;i+=200){
      const chunk=keys.slice(i,i+200), items=[], stamp={};
      for(const key of chunk){
        const p=key.indexOf(':'), kind=key.slice(0,p), id=key.slice(p+1);
        const r=db[kind]&&db[kind][id];
        if(r){items.push(toRow(kind,r)); stamp[key]=sync.dirty[key]} else delete sync.dirty[key];
      }
      if(!items.length) continue;
      const {error}=await sb.rpc('push_records',{items});
      if(error) throw error;
      for(const key in stamp) if(sync.dirty[key]===stamp[key]) delete sync.dirty[key];
      saveSync();
    }
    let changed=false;
    for(let guard=0;guard<50;guard++){
      let q=sb.from('records').select('id,kind,data,field_ts,updated_at,server_updated_at').order('server_updated_at',{ascending:true}).limit(1000);
      if(sync.cursor){const from=new Date(Date.parse(sync.cursor)-10000).toISOString(); q=q.gt('server_updated_at',from)}
      const {data,error}=await q;
      if(error) throw error;
      let last=sync.cursor;
      for(const row of data){if(mergeRow(row)) changed=true; last=row.server_updated_at}
      const advanced=last!==sync.cursor;
      sync.cursor=last;
      if(data.length<1000||!advanced) break;
    }
    saveSync();
    if(changed){save(); safeRender()}
    setSyncState('ok');
  }catch(e){
    setSyncState(navigator.onLine?'error':'offline',e&&(e.message||e.error_description)||'');
    clearTimeout(syncTimer); syncTimer=setTimeout(runSync,30000);
  }finally{
    syncing=false;
    if(syncAgain){syncAgain=false; scheduleSync(300)}
  }
}
function importCopy(p){

      rec.updatedAt=now;
      db[k][rec.id]=rec; sync.dirty[k+':'+rec.id]=now; n++;

  save(); saveSync(); scheduleSync(300);

function authError(e){
  const t=(e&&e.message||'').toLowerCase();
  if(t.includes('invalid login')) return 'Неверная почта или пароль.';
  if(t.includes('not confirmed')) return 'Почта не подтверждена. Откройте письмо от Supabase и перейдите по ссылке, затем войдите.';
  if(t.includes('already registered')||t.includes('already been registered')) return 'Аккаунт с этой почтой уже есть. Нажмите «Войти».';
  if(t.includes('signups not allowed')||t.includes('signup is disabled')) return 'Регистрация новых аккаунтов закрыта.';
  if(t.includes('password')&&t.includes('6')) return 'Пароль должен быть не короче 6 символов.';
  if(t.includes('rate limit')) return 'Слишком много попыток. Подождите минуту и повторите.';
  if(t.includes('fetch')||t.includes('network')) return 'Нет связи с облаком. Проверьте интернет.';
  return e&&e.message?e.message:'Не получилось. Повторите ещё раз.';
}
